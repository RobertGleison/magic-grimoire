name: Supabase keepalive

# Free-tier Supabase projects are paused after 7 days without activity. This
# pings the project twice a week (max gap 4 days) with a real database read so
# it never goes idle long enough to be paused.
#
# One-time setup:
#   1. Repo secrets (Settings → Secrets and variables → Actions):
#        SUPABASE_URL       https://<project-ref>.supabase.co
#        SUPABASE_ANON_KEY  the project's anon / publishable key
#   2. In the Supabase SQL editor, create the table the ping reads:
#
#        create table if not exists public.keepalive (
#          id int primary key default 1,
#          pinged_at timestamptz not null default now()
#        );
#        insert into public.keepalive (id) values (1) on conflict do nothing;
#        alter table public.keepalive enable row level security;
#        create policy "keepalive is readable" on public.keepalive
#          for select to anon using (true);
#
# Run it once by hand (Actions → Supabase keepalive → Run workflow) to check the
# setup. GitHub disables scheduled workflows after 60 days without repository
# activity; re-enable it from the Actions tab if that happens.

on:
  schedule:
    - cron: "17 9 * * 1,4" # Mondays and Thursdays, 09:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_ANON_KEY repo secrets are required"
            exit 1
          fi

      - name: Read from the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --silent --show-error --fail-with-body \
            --retry 3 --retry-delay 10 --retry-all-errors --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "${SUPABASE_URL%/}/rest/v1/keepalive?select=id&limit=1" \
            || { echo "::error::Keepalive query failed. Is the public.keepalive table set up? See the comment at the top of this workflow."; exit 1; }
          echo

      - name: Check the auth service
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --silent --show-error --fail-with-body \
            --retry 3 --retry-delay 10 --retry-all-errors --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "${SUPABASE_URL%/}/auth/v1/health"
          echo
