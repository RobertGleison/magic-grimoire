name: deploy web

on:
  push:
    branches: [main]
    paths:
      - "apps/web-app/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Same pin as web-app.yml: vitest 4 needs Node >= 20.12.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/web-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/web-app

      - name: Unit tests
        run: npm run test:unit
        working-directory: apps/web-app

      # `output: "export"` (next.config.ts) writes the static site to out/.
      # NEXT_PUBLIC_* values are inlined into the browser bundle, so they are public
      # by design; they live in secrets only so this workflow can read them.
      - name: Build static site
        run: npm run build
        working-directory: apps/web-app
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.magic-grimoire.com/api/v1
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # The Pages project (infra/terraform/cloudflare.tf) has no git source, so
      # deploys are direct uploads; --branch=main makes this the production deployment.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web-app
          command: pages deploy out --project-name=magic-grimoire --branch=main
